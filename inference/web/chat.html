<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinybrain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22 width=%22512%22 height=%22512%22 role=%22img%22 aria-label=%22tinybrain%22%3E %3Crect width=%22512%22 height=%22512%22 fill=%22%232140d6%22/%3E %3Cg transform=%22translate(56,66) scale(1.0)%22%3E %3Cpath d=%22M238.71,0 L209.91,180 H40 A40,40 0 0 1 0,140 A140,140 0 0 1 140,0 Z%22 fill=%22%23ffd21f%22/%3E %3Cpath d=%22M252.89,0 H260 A140,140 0 0 1 400,140 V180 H224.09 Z%22 fill=%22%23e9482b%22/%3E %3Crect x=%2264%22 y=%22194%22 width=%22226%22 height=%22100%22 rx=%2250%22 fill=%22%23ffffff%22/%3E %3Cpath d=%22M304,194 H400 A92,92 0 0 1 308,286 H304 Z%22 fill=%22%23000000%22/%3E %3Cpath d=%22M304,300 H384 A40,40 0 0 1 304,300 Z%22 fill=%22%23ffd21f%22/%3E %3Cpath d=%22M285.50,308.00 L285.50,380.00%22 stroke=%22%23ffd21f%22 stroke-width=%229.5%22 fill=%22none%22/%3E %3Cpath d=%22M276.50,308.00 L276.50,380.00%22 stroke=%22%23ffffff%22 stroke-width=%229.5%22 fill=%22none%22/%3E %3Cpath d=%22M267.50,308.00 L267.50,380.00%22 stroke=%22%23e9482b%22 stroke-width=%229.5%22 fill=%22none%22/%3E %3Cpath d=%22M258.50,308.00 L258.50,380.00%22 stroke=%22%23000000%22 stroke-width=%229.5%22 fill=%22none%22/%3E %3C/g%3E %3C/svg%3E">
<style>
:root {
  --blue: #2140d6;
  --blue-deep: #182fa3;
  --yellow: #ffd21f;
  --red: #e9482b;
  --green: #15965a;
  --mist: #eef1fb;
  --ink: #000;
  --paper: #fff;
  --muted: #4a5170;
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 16px; line-height: 1.7; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }

/* 左边的蓝色色块：字标、存档、模式和采样设置 */
.side { background: var(--blue); color: var(--paper); padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
.side :focus-visible { outline-color: var(--yellow); }
.mark { margin: 0; color: var(--yellow); font-size: 56px; line-height: .95; font-weight: 900; letter-spacing: -0.045em; }
.tagline { margin: 6px 0 0; font-size: 14px; opacity: .85; }
.ckpt { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 14px; }
.ckpt dt { opacity: .75; }
.ckpt dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.modes { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--paper); }
.modes button { border: 0; padding: 10px 0; background: transparent; font-weight: 700; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
.knob { display: grid; gap: 4px; font-size: 14px; }
.knob .row { display: flex; justify-content: space-between; }
.knob output { font-weight: 700; font-variant-numeric: tabular-nums; }
.knob input[type="range"] { width: 100%; accent-color: var(--yellow); }
.knob small { opacity: .75; line-height: 1.5; }
.knob + .knob { margin-top: 18px; }
.settings summary + .knob { margin-top: 12px; }
.side .reset { margin-top: auto; border: 2px solid var(--paper); background: transparent; padding: 8px 0; font-weight: 700; cursor: pointer; }
.side .reset:hover { background: var(--blue-deep); }
.side a { color: var(--paper); font-size: 13px; opacity: .8; }

/* 右边：对话区和输入框 */
.main { display: flex; flex-direction: column; min-height: 0; }
.notice { margin: 0; padding: 12px 28px; background: var(--yellow); font-size: 15px; }
.notice.error { background: var(--red); color: var(--paper); }
.log { flex: 1; overflow-y: auto; padding: 32px 28px 16px; }
.log-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

.empty h2 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.empty p { margin: 0 0 16px; color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; gap: 10px; }
.examples button { border: 2px solid var(--ink); background: var(--paper); padding: 6px 14px; cursor: pointer; font-size: 15px; }
.examples button:hover { background: var(--mist); }

.turn { white-space: pre-wrap; overflow-wrap: anywhere; }
.turn.user { align-self: flex-end; max-width: 80%; background: var(--yellow); padding: 12px 16px; }
.turn.model { border-left: 6px solid var(--blue); padding: 2px 0 2px 16px; }
.turn.cont { border-left: 6px solid var(--green); padding: 2px 0 2px 16px; }
.cont .given { font-weight: 700; }
.cont .written { color: var(--blue); }
.meta { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); white-space: normal; }
.failed { color: var(--red); font-weight: 600; }
.caret { display: inline-block; width: .6em; height: 1.05em; margin-left: 2px; vertical-align: -0.15em; background: var(--yellow); outline: 2px solid var(--ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

.composer { border-top: 2px solid var(--ink); padding: 16px 28px 20px; }
.composer-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.composer textarea { width: 100%; min-height: 52px; max-height: 240px; resize: none; border: 2px solid var(--ink); padding: 12px 14px; background: var(--paper); line-height: 1.6; }
.composer textarea:focus-visible { outline-offset: 0; }
.send { border: 0; background: var(--red); color: var(--paper); font-weight: 800; padding: 0 26px; height: 52px; cursor: pointer; font-size: 17px; }
.send.stop { background: var(--ink); }
.send:disabled { opacity: .45; cursor: not-allowed; }
.hint { max-width: 760px; margin: 8px auto 0; font-size: 13px; color: var(--muted); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { padding: 14px 16px; gap: 12px; }
  .mark { font-size: 34px; }
  .tagline, .side a { display: none; }
  .ckpt { grid-template-columns: auto 1fr auto 1fr; font-size: 12px; gap: 0 10px; }
  .modes button { padding: 6px 0; }
  .side .reset { margin-top: 0; padding: 4px 0; font-size: 14px; }
  .log { padding: 20px 16px 12px; }
  .notice, .composer { padding-left: 16px; padding-right: 16px; }
  .turn.user { max-width: 92%; }
}
.settings summary { cursor: pointer; font-weight: 700; font-size: 14px; }
@media (min-width: 761px) { .settings summary { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div>
      <h1 class="mark">tinybrain</h1>
      <p class="tagline">从零做的中文小模型</p>
    </div>
    <dl class="ckpt" id="ckpt">
      <dt>存档</dt><dd>读取中</dd>
    </dl>
    <div class="modes" role="group" aria-label="用法">
      <button type="button" data-mode="continue" aria-pressed="true">续写</button>
      <button type="button" data-mode="chat" aria-pressed="false">对话</button>
    </div>
    <details class="settings" open>
      <summary>采样设置</summary>
      <label class="knob">
        <span class="row"><span>温度</span><output id="temperature-out"></output></span>
        <input id="temperature" type="range" min="0" max="1.5" step="0.05">
        <small>0 是每次取最可能的词，小模型这样容易陷进重复</small>
      </label>
      <label class="knob">
        <span class="row"><span>候选词</span><output id="top-k-out"></output></span>
        <input id="top-k" type="range" min="0" max="200" step="5">
        <small>只在概率最高的这么多个词里挑，0 是不限</small>
      </label>
      <label class="knob">
        <span class="row"><span>最多写</span><output id="max-tokens-out"></output></span>
        <input id="max-tokens" type="range" min="16" max="1024" step="16">
      </label>
    </details>
    <button type="button" class="reset" id="reset">清空</button>
    <a href="https://github.com/logitcai/tinybrain" target="_blank" rel="noopener">github.com/logitcai/tinybrain</a>
  </aside>

  <main class="main">
    <p class="notice" id="notice" hidden></p>
    <div class="log" id="log" aria-live="polite">
      <div class="log-inner" id="log-inner"></div>
    </div>
    <form class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" aria-label="输入" placeholder="写一个开头，模型接着往下写"></textarea>
        <button type="submit" class="send" id="send">续写</button>
      </div>
      <p class="hint">回车发送，Shift + 回车换行</p>
    </form>
  </main>
</div>

<script>
const STAGES = { pretrain: "预训练", anneal: "退火", sft: "SFT", mopd: "多老师蒸馏", rl: "强化学习", rlaif: "评审强化学习", rlvr: "可验证强化学习",
  agent: "工具调用强化学习", expert_math: "数学专家", expert_code: "代码专家", expert_literature: "文学专家" };
const EXAMPLES = {
  continue: ["床前明月光，", "北京是中国的", "人工智能是", "def fibonacci(n):", "The capital of France is"],
  chat: ["你好，请介绍一下你自己。", "为什么天空是蓝色的？", "写一首关于秋天的五言绝句。", "把「学而时习之，不亦说乎」翻译成白话文。"],
};
const COPY = {
  continue: { button: "续写", placeholder: "写一个开头，模型接着往下写", title: "写个开头试试", lead: "模型会接着你写的文字往下写。点下面的例子，或者自己写一个。" },
  chat: { button: "发送", placeholder: "问点什么", title: "问点什么", lead: "多轮对话，前面说过的话会一起发给模型。" },
};
const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("tinybrain." + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("tinybrain." + key, JSON.stringify(value)); } catch {} },
};
const state = { mode: store.get("mode", null), info: null, messages: [], busy: false, controller: null };

const knobs = {
  temperature: { el: $("temperature"), out: $("temperature-out"), fallback: 0.8, show: (v) => Number(v).toFixed(2) },
  top_k: { el: $("top-k"), out: $("top-k-out"), fallback: 50, show: (v) => (Number(v) ? v : "不限") },
  max_tokens: { el: $("max-tokens"), out: $("max-tokens-out"), fallback: 256, show: (v) => v + " 个词" },
};
for (const [key, k] of Object.entries(knobs)) {
  k.el.value = store.get(key, k.fallback);
  k.out.textContent = k.show(k.el.value);
  k.el.addEventListener("input", () => { k.out.textContent = k.show(k.el.value); store.set(key, Number(k.el.value)); });
}
const sampling = () => ({ temperature: Number(knobs.temperature.el.value), top_k: Number(knobs.top_k.el.value) || null,
  max_tokens: Number(knobs.max_tokens.el.value) });

function showNotice(text, error = false) {
  const n = $("notice");
  n.hidden = !text;
  n.textContent = text || "";
  n.classList.toggle("error", error);
}

function updateNotice() {
  if (!state.info) return;
  if (state.info.kind === "base" && state.mode === "continue") {
    showNotice("这是" + (STAGES[state.info.stage] || state.info.stage) + "存档，还没学过对话：它会接着你写的开头往下写，不会回答问题。");
  } else if (state.info.kind === "base") {
    showNotice("这个存档还没学过对话，回答多半对不上题。想看它学到了什么，先用续写。");
  } else {
    showNotice("");
  }
}

function setMode(mode) {
  if (state.busy) return;
  state.mode = mode;
  store.set("mode", mode);
  for (const b of document.querySelectorAll(".modes button")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  $("send").textContent = COPY[mode].button;
  $("input").placeholder = COPY[mode].placeholder;
  state.messages = [];
  render();
  updateNotice();
}

function render() {
  const inner = $("log-inner");
  inner.replaceChildren();
  const box = document.createElement("section");
  box.className = "empty";
  box.innerHTML = `<h2></h2><p></p><div class="examples"></div>`;
  box.querySelector("h2").textContent = COPY[state.mode].title;
  box.querySelector("p").textContent = COPY[state.mode].lead;
  for (const text of EXAMPLES[state.mode]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => { $("input").value = text; send(); });
    box.querySelector(".examples").append(b);
  }
  inner.append(box);
}

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

function addTurn(kind) {
  const inner = $("log-inner");
  inner.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "turn " + kind;
  inner.append(el);
  return el;
}

// 读 server-sent events：每段是 data: {...}，最后是 data: [DONE]
async function* readEvents(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const event = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      for (const line of event.split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6);
        if (data === "[DONE]") return;
        yield JSON.parse(data);
      }
    }
  }
}

function describeEnd(reason, tokens, seconds, mode) {
  const speed = seconds > 0 ? `，每秒 ${Math.round(tokens / seconds)} 词` : "";
  const end = reason === "stop" ? (mode === "chat" ? "说完了" : "写完了一篇") : reason === "length" ? "到了长度上限" : "停下了";
  return `${tokens} 个词${speed}，${end}`;
}

async function send() {
  const input = $("input");
  const text = input.value;
  if (state.busy || !text.trim()) return;
  input.value = "";
  autosize();
  const mode = state.mode;
  let target, endpoint, body;
  if (mode === "chat") {
    addTurn("user").textContent = text;
    state.messages.push({ role: "user", content: text });
    target = addTurn("model");
    endpoint = "/v1/chat/completions";
    body = { messages: state.messages, stream: true, ...sampling() };
  } else {
    const turn = addTurn("cont");
    const given = document.createElement("span");
    given.className = "given";
    given.textContent = text;
    target = document.createElement("span");
    target.className = "written";
    turn.append(given, target);
    endpoint = "/v1/completions";
    body = { prompt: text, stream: true, ...sampling() };
  }
  const written = document.createElement("span");
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.setAttribute("aria-hidden", "true");
  target.append(written, caret);
  scrollDown();

  setBusy(true);
  const controller = new AbortController();
  state.controller = controller;
  const started = performance.now();
  let reply = "", reason = null, tokens = 0;
  try {
    const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: controller.signal });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `服务返回 ${response.status}`);
    }
    for await (const chunk of readEvents(response)) {
      const choice = chunk.choices[0];
      const piece = mode === "chat" ? (choice.delta.content || "") : (choice.text || "");
      reply += piece;
      written.textContent = reply;
      if (choice.finish_reason) reason = choice.finish_reason;
      if (chunk.usage) tokens = chunk.usage.completion_tokens;
      scrollDown();
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      const fail = document.createElement("span");
      fail.className = "failed";
      fail.textContent = (reply ? "\n" : "") + "没写完：" + e.message;
      target.append(fail);
    }
  } finally {
    caret.remove();
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = describeEnd(reason, tokens || [...reply].length, (performance.now() - started) / 1000, mode);
    (mode === "chat" ? target : target.parentElement).append(meta);
    if (mode === "chat") state.messages.push({ role: "assistant", content: reply });
    state.controller = null;
    setBusy(false);
    scrollDown();
    input.focus();
  }
}

function setBusy(busy) {
  state.busy = busy;
  const button = $("send");
  button.classList.toggle("stop", busy);
  button.textContent = busy ? "停止" : COPY[state.mode].button;
  for (const b of document.querySelectorAll(".modes button")) b.disabled = busy;
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight + 4, 240) + "px";
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.busy) state.controller?.abort();
  else send();
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("input").addEventListener("input", autosize);
$("reset").addEventListener("click", () => {
  if (state.busy) state.controller?.abort();
  state.messages = [];
  render();
});
for (const b of document.querySelectorAll(".modes button")) b.addEventListener("click", () => setMode(b.dataset.mode));

function showInfo(info) {
  const rows = [["模型", info.name], ["阶段", STAGES[info.stage] || info.stage || "—"]];
  if (info.step != null) rows.push(["步数", "第 " + Number(info.step).toLocaleString("zh-CN") + " 步"]);
  if (info.params) rows.push(["参数", (info.params / 1e8).toFixed(2) + " 亿" + (info.trunk ? `（主干 ${(info.trunk / 1e8).toFixed(2)} 亿）` : "")]);
  rows.push(["上下文", info.max_seq_len + " 个词"]);
  const dl = $("ckpt");
  dl.replaceChildren();
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k;
    dd.textContent = v;
    dl.append(dt, dd);
  }
}

if (matchMedia("(max-width: 760px)").matches) document.querySelector(".settings").open = false;  // 手机上先收起，把地方留给对话

(async () => {
  try {
    const response = await fetch("/v1/info");
    state.info = await response.json();
    showInfo(state.info);
  } catch {
    showNotice("连不上 tinygo serve：确认它还在运行，再刷新这个页面。", true);
  }
  setMode(state.mode || (state.info && state.info.kind === "chat" ? "chat" : "continue"));
  $("input").focus();
})();
</script>
</body>
</html>
