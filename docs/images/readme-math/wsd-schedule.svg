<title>WSD 学习率曲线</title>
<desc>\begin{gathered}
s(t) =
\begin{cases}
\dfrac{t+1}{T_w} &amp; t &lt; T_w, \\[2mm]
1 &amp; T_w \le t &lt; T - T_d, \\[2mm]
1 - (1-f)\sqrt{p} &amp; t \ge T - T_d,
\end{cases} \\[2mm]
p = \dfrac{t - (T - T_d) + 1}{T_d}.
\end{gathered}</desc>
